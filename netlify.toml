[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev:ui"
  targetPort = 5173
  framework = "#custom"

# Single-page app fallback (API routes are declared in the function itself)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
